name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Tests
        run: |
          pytest -v

      - name: Build Standalone EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "AndroidAdwareCleaner" --add-data "core;core" --add-data "gui;gui" --hidden-import customtkinter --hidden-import reportlab --hidden-import PIL --hidden-import pyaxmlparser --collect-all customtkinter main.py

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AndroidAdwareCleaner -DestinationPath AndroidAdwareCleaner-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAdwareCleaner-Windows
          path: AndroidAdwareCleaner-Windows.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AndroidAdwareCleaner-Windows.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
